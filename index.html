<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="册光，在浏览器内批量整理书籍产品照。">
<title>册光 · 书籍产品图</title>
<style>:root{color-scheme:light;--base:#f2efe9;--paper:#fbfaf6;--surface:#f7f5f0;--ink:#292521;--muted:#736a60;--line:#dfd9ce;--accent:#b53e27;--accent-active:#f4e4dc;--font:Inter,"PingFang SC","Microsoft YaHei","Noto Sans CJK SC",system-ui,sans-serif;--mono:"SFMono-Regular",Consolas,"Liberation Mono",monospace}
*{box-sizing:border-box}
body{margin:0;background:var(--base);color:var(--ink);font:14px/1.45 var(--font)}
button,select,input{font:inherit}
button{cursor:pointer}
button:disabled{cursor:default;opacity:.48}
button:focus-visible,select:focus-visible,input:focus-visible,summary:focus-visible,canvas:focus-visible{outline:2px solid #c7472e;outline-offset:3px}
[hidden]{display:none!important}
svg{width:18px;height:18px;stroke:currentColor;stroke-width:1.6;fill:none;stroke-linecap:round;stroke-linejoin:round;flex:none;vertical-align:middle}
.svg-defs,.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
.site-head{height:68px;padding:0 max(30px,calc((100vw - 1480px)/2));background:var(--paper);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}
.brand{display:flex;align-items:center;gap:11px;font-size:21px;font-weight:800;white-space:nowrap;letter-spacing:-.04em}
.brand small{font:600 10px var(--mono);letter-spacing:.15em;color:var(--muted);margin-left:9px;vertical-align:2px}
.brand-mark{width:34px;height:34px;display:grid;place-items:center;background:var(--accent);color:white;border-radius:4px}
.brand-mark svg{width:21px;height:21px}
.local{display:flex;align-items:center;gap:7px;color:var(--muted);font-size:12px}
.local svg{width:16px;height:16px;color:#4a6752}
main{max-width:1540px;margin:auto;padding:26px 30px 34px}
.intro{display:flex;align-items:end;justify-content:space-between;gap:16px;margin:0 0 23px}
.intro h1{font-size:clamp(30px,3.4vw,47px);line-height:1.15;letter-spacing:-.085em;margin:0 0 6px;font-weight:820}
.intro h1 span{color:var(--accent);margin-left:4px}
.intro p{color:var(--muted);margin:0;font-size:13px}
.button{min-height:40px;padding:0 14px;display:inline-flex;justify-content:center;align-items:center;gap:8px;border:1px solid transparent;border-radius:5px;font-weight:670;white-space:nowrap}
.button svg{width:16px;height:16px}
.primary{background:var(--accent);color:#fff}
.primary:hover:not(:disabled){background:#96321f}
.secondary{border-color:var(--line);color:var(--ink);background:var(--paper)}
.secondary:hover:not(:disabled){background:#efeae0;border-color:#c7baaa}
.workspace{display:grid;grid-template-columns:minmax(176px,220px) minmax(0,1fr) minmax(270px,304px);gap:15px;align-items:stretch}
.panel{min-width:0;background:var(--paper);border:1px solid var(--line);border-radius:8px;overflow:hidden;display:flex;flex-direction:column}
.panel-head{min-height:55px;display:flex;align-items:center;justify-content:space-between;gap:6px;border-bottom:1px solid var(--line);padding:0 14px}
.panel-head h2{margin:0;font-size:14px;line-height:1;display:flex;align-items:center;gap:8px;white-space:nowrap}
.panel-head h2 svg{color:#74685c}
.pill{padding:2px 7px;font:11px/1.3 var(--mono);border-radius:20px;background:#eee9e0;color:#6a5d50}
.queue-content{padding:11px;display:flex;flex-direction:column;gap:10px}
.items{display:flex;flex-direction:column;gap:7px;max-height:490px;overflow:auto}
.items:empty{display:none}
.item{position:relative;display:flex;align-items:center;gap:3px;border:1px solid var(--line);border-radius:5px;padding:4px;background:var(--surface);min-height:59px}
.item.selected{border-color:#c37261;background:#f7ebe4}
.item-pick{display:flex;align-items:center;gap:8px;min-width:0;flex:1;border:0;background:none;text-align:left;color:inherit;padding:0}
.item-image{width:43px;height:47px;flex:none;object-fit:cover;border-radius:3px;background:#dfd9ce;display:grid;place-items:center}
.item-title,.item-meta{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item-title{font-size:12px;font-weight:700}
.item-meta{font-size:10px;color:var(--muted);margin-top:4px}
.item-remove{background:transparent;border:0;color:var(--muted);padding:4px;display:grid;place-items:center}
.item-remove:hover{color:var(--accent);background:#ecddd4;border-radius:3px}
.item-remove svg{width:13px;height:13px}
.drop{width:100%;min-height:113px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;background:#f8f5ed;border:1px dashed #c7b9a4;border-radius:5px;color:var(--ink);padding:10px 4px}
.drop:hover,.dragover .drop{border-color:var(--accent);background:var(--accent-active)}
.drop-icon{width:26px;height:26px;display:grid;place-items:center;background:#eee7da;border-radius:4px;color:var(--accent)}
.drop strong{font-size:12px}
.drop small{color:var(--muted);font-size:10px}
.queue-foot{margin:auto 0 0;border-top:1px solid var(--line);padding:11px;color:var(--muted);display:flex;align-items:flex-start;gap:6px;font-size:10px}
.queue-foot svg{width:14px;height:14px}
.text-btn{background:none;border:0;color:var(--muted);font-size:11px;font-weight:650;padding:5px 4px;display:inline-flex;align-items:center;justify-content:center;gap:4px;white-space:nowrap;border-radius:3px}
.text-btn:hover:not(:disabled){color:var(--accent);background:var(--accent-active)}
.text-btn svg{width:14px;height:14px}
.demo-btn{align-self:center;color:var(--accent)}
.segmented{display:inline-flex;align-items:center;gap:2px;background:#f0ece4;border:1px solid #e5ded3;border-radius:5px;padding:2px}
.segmented button{border:1px solid transparent;border-radius:3px;color:var(--muted);background:transparent;font-size:11px;white-space:nowrap;padding:4px 10px;font-weight:630}
.segmented button[aria-pressed=true]{color:var(--ink);background:var(--paper);border-color:#ded6c8;box-shadow:0 1px 2px #40302012}
.stage{position:relative;flex:1;display:flex;align-items:center;justify-content:center;min-height:530px;padding:23px;background-color:#e3dfd7;background-image:radial-gradient(#bcb2a4 0.55px,transparent 0.55px);background-size:15px 15px;overflow:hidden}
.paper{display:flex;align-items:center;justify-content:center;max-width:100%;max-height:100%;box-shadow:0 1px 2px #40302035,0 8px 26px #40302020;background:#e9e7e3}
.paper.checker{background-color:#fff}
#preview{display:block;max-width:100%;max-height:min(58vh,590px);width:auto;height:auto;object-fit:contain}
.paper.mask-mode #preview{touch-action:none;cursor:crosshair}
.empty{text-align:center;color:var(--muted);max-width:300px}
.empty>svg{width:38px;height:38px;color:#877968}
.empty h3{font-size:16px;color:var(--ink);margin:10px 0 4px}
.empty p{margin:0;font-size:12px}
.preview-foot{min-height:38px;padding:0 13px;display:flex;justify-content:space-between;align-items:center;gap:8px;border-top:1px solid var(--line);font:11px var(--mono);color:var(--muted)}
.preview-foot>span:first-child{display:flex;align-items:center;gap:7px;font:11px var(--font)}
.dot{width:6px;height:6px;border-radius:50%;background:#52785e;display:block}
.dot.wait{background:#ad7454}
.mask-tools{padding:7px 11px;display:flex;align-items:center;flex-wrap:wrap;gap:6px;border-bottom:1px solid var(--line)}
.brush-size{display:flex;align-items:center;gap:5px;color:var(--muted);font-size:11px}
.brush-size input{width:66px}
.notice{background:#f8ebe0;color:#744330;border-top:1px solid #e8d6c4;padding:7px 12px;font-size:11px}
.settings-content{display:flex;flex-direction:column}
.setting-section{padding:12px 13px;border-bottom:1px solid var(--line)}
.setting-section h3,.export-area h3{margin:0 0 8px;font-size:12px;display:flex;align-items:center;gap:6px}
.setting-section h3 svg{width:15px;height:15px;color:#7a6b5e}
.swatches{display:flex;justify-content:space-between;gap:5px}
.swatches button,.custom-chip{width:32px;height:28px;min-width:0;display:grid;place-items:center;border-radius:4px;border:1px solid #c8bfae;background:var(--chip);padding:0;position:relative;color:#7b6c5d}
.swatches button[aria-pressed=true]{outline:1.5px solid var(--accent);outline-offset:2px}
.custom-chip{background:#f4f0e8;cursor:pointer}
.custom-chip svg{width:14px;height:14px}
.custom-chip input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer}
.custom-chip:focus-within{outline:2px solid var(--accent);outline-offset:2px}
.checker{background-color:#fcfbf9!important;background-image:repeating-conic-gradient(#d9d5ce 0% 25%,transparent 0% 50%)!important;background-size:12px 12px!important}
.background-label{display:flex;justify-content:space-between;margin-top:7px;font-size:10px;color:var(--muted)}
.background-label span:last-child{font-family:var(--mono)}
.light-grid,.ratio-grid{display:grid;gap:5px}
.light-grid{grid-template-columns:repeat(3,minmax(0,1fr))}
.ratio-grid{grid-template-columns:repeat(4,minmax(0,1fr))}
.light-grid button,.ratio-grid button{display:flex;align-items:center;justify-content:center;gap:5px;min-height:31px;padding:4px 2px;border:1px solid var(--line);border-radius:4px;background:var(--surface);font-size:10px;color:#62564b;white-space:nowrap}
.light-grid button[aria-pressed=true],.ratio-grid button[aria-pressed=true]{color:#942f1e;background:var(--accent-active);border-color:#d9a296}
.light-icon{width:12px;height:12px;border-radius:50%;display:inline-block;border:1px solid currentColor}
.light-icon.soft{background:linear-gradient(135deg,#f7eee3,#b57f68)}
.light-icon.side{background:linear-gradient(105deg,transparent 50%,currentColor 50%)}
.ratio{display:inline-block;width:11px;height:11px;border:1px solid currentColor;border-radius:1px}
.ratio.portrait{width:9px;height:12px}
.ratio.landscape{width:13px;height:9px}
.ratio.story{width:7px;height:12px}
.slider{display:block;margin-top:9px}
.slider>span{display:flex;justify-content:space-between;font-size:11px;line-height:1.2;color:#524a40}
.slider output{color:#766958;font:10px var(--mono)}
input[type=range]{accent-color:var(--accent);cursor:pointer;margin:4px 0 0;height:13px}
.slider input{width:100%;display:block}
details{margin-top:7px}
summary{color:var(--muted);cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:11px;list-style:none}
summary::-webkit-details-marker{display:none}
summary svg{width:13px;height:13px}
details[open] summary svg{transform:rotate(180deg)}
.cut-settings{padding-top:9px;padding-bottom:9px}
.cut-settings details{margin:0}
.cut-settings summary{color:var(--ink);font-weight:670}
.field{display:flex;align-items:center;justify-content:space-between;gap:7px;margin-top:8px;color:#524a40;font-size:11px}
.field-note{font-size:10px;color:var(--muted);margin:7px 0 0}
select{width:100%;min-height:29px;background:var(--surface);border:1px solid var(--line);color:var(--ink);border-radius:4px;padding:3px 5px;font-size:11px}
.field select{max-width:135px}
.export-area{padding:11px 13px 13px;margin-top:auto}
.export-fields{display:grid;grid-template-columns:1.45fr 1fr;gap:6px;margin-bottom:7px}
.download{width:100%;min-height:35px;font-size:12px}
.download+.download{margin-top:5px}
.toast{position:fixed;z-index:5;bottom:18px;left:50%;transform:translateX(-50%);padding:9px 14px;margin:0;background:#342b23;color:#fff;box-shadow:0 2px 8px #32201040;border-radius:5px;font-size:12px;max-width:calc(100vw - 28px);width:max-content}
.dragover .stage{box-shadow:inset 0 0 0 3px #b53e2788}
@media(max-width:1060px){main{padding:20px 18px 28px}.site-head{padding:0 18px}.workspace{gap:10px;grid-template-columns:minmax(149px,170px) minmax(0,1fr) 265px}.stage{padding:15px}}
@media(max-width:790px){.workspace{grid-template-columns:minmax(0,1fr) 245px}.queue{grid-column:1/-1}.queue-content{display:grid;grid-template-columns:minmax(0,1fr) minmax(120px,172px);align-items:center;padding:8px}.items{flex-direction:row;overscroll-behavior-inline:contain}.item{min-width:147px;max-width:173px}.drop{min-height:59px;grid-column:2;grid-row:1;gap:1px}.drop-icon{width:19px;height:19px}.drop-icon svg{width:13px;height:13px}.demo-btn{grid-column:1;grid-row:1;justify-self:start}.items:not(:empty)~.demo-btn{display:none}.queue-foot{display:none}.queue .panel-head{min-height:39px}.stage{min-height:400px}}
@media(max-width:550px){.site-head{height:55px;padding:0 12px}.brand{font-size:18px}.brand-mark{width:29px;height:29px}.brand small{margin-left:4px;font-size:8px}.local{font-size:10px;gap:3px}.local svg{width:13px;height:13px}main{padding:16px 10px 25px}.intro{align-items:center;gap:8px;margin-bottom:15px}.intro h1{font-size:30px}.intro p{font-size:11px}.intro .button{padding:0 8px;font-size:11px;gap:5px;min-height:34px}.workspace{grid-template-columns:1fr;gap:10px}.stage{min-height:0;padding:14px}.stage:has(.empty:not([hidden])){min-height:240px}#preview{max-height:55vh}.panel-head{min-height:43px}.settings-content{display:grid;grid-template-columns:1fr 1fr}.setting-section{padding:10px}.setting-section:nth-child(odd){border-right:1px solid var(--line)}.swatches{gap:4px}.swatches button,.custom-chip{width:23px;height:23px}.cut-settings{padding-top:12px}.export-area{padding:10px}.download{min-height:39px}}
@media(prefers-reduced-motion:no-preference){button{transition:background-color .12s,color .12s,border-color .12s}}
</style>
</head>
<body>
<svg class="svg-defs" aria-hidden="true" xmlns="http://www.w3.org/2000/svg"><defs>
<symbol id="i-logo" viewBox="0 0 24 24"><path d="M3 4h14v16H3zM6 4v16M19 6h2v16H6"/><path d="M10 10h4m-4 3h4"/></symbol>
<symbol id="i-upload" viewBox="0 0 24 24"><path d="M12 16V3m-5 5 5-5 5 5M4 15v5h16v-5"/></symbol>
<symbol id="i-down" viewBox="0 0 24 24"><path d="M12 3v13m-5-5 5 5 5-5M4 17v4h16v-4"/></symbol>
<symbol id="i-stack" viewBox="0 0 24 24"><path d="M8 3h12v13H8zM4 7v13h12M11 7h6m-6 4h4"/></symbol>
<symbol id="i-folder" viewBox="0 0 24 24"><path d="M3 6h7l2 2h9v12H3z"/></symbol>
<symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
<symbol id="i-shield" viewBox="0 0 24 24"><path d="M12 3 4 6v5c0 4.5 3.1 7.5 8 10 4.9-2.5 8-5.5 8-10V6z"/><path d="m8.5 12 2.2 2.2 4.8-4.8"/></symbol>
<symbol id="i-close" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></symbol>
<symbol id="i-image" viewBox="0 0 24 24"><path d="M3 4h18v16H3zM3 16l5-5 4 4 3-3 6 6"/><circle cx="15.5" cy="8.5" r="1"/></symbol>
<symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v3m0 14v3M2 12h3m14 0h3M5 5l2 2m10 10 2 2m0-14-2 2M7 17l-2 2"/></symbol>
<symbol id="i-frame" viewBox="0 0 24 24"><path d="M8 3H3v5m13-5h5v5M3 16v5h5m13-5v5h-5M8 8h8v8H8z"/></symbol>
<symbol id="i-color" viewBox="0 0 24 24"><circle cx="9" cy="10" r="5"/><circle cx="15" cy="14" r="5"/></symbol>
<symbol id="i-chevron" viewBox="0 0 24 24"><path d="m7 10 5 5 5-5"/></symbol>
<symbol id="i-reset" viewBox="0 0 24 24"><path d="M5 10a7 7 0 1 1 1.1 6.4M5 4v6h6"/></symbol>
<symbol id="i-arrow" viewBox="0 0 24 24"><path d="M5 12h14m-6-6 6 6-6 6"/></symbol>
</defs></svg>

<header class="site-head">
  <div class="brand"><span class="brand-mark"><svg><use href="#i-logo"/></svg></span><span>册光 <small>FOLIO STUDIO</small></span></div>
  <div class="local"><svg><use href="#i-shield"/></svg><span>图片仅在本机处理</span></div>
</header>

<main>
  <section class="intro">
    <div><h1>书籍产品图<span>.</span></h1><p>把随手拍的书照整理成同一套产品图。</p></div>
    <button class="button primary" id="add"><svg><use href="#i-upload"/></svg> 添加图片</button>
    <input type="file" id="files" accept="image/*,.jpg,.jpeg,.png,.webp,.avif,.heic,.heif" multiple hidden>
  </section>

  <div class="workspace">
    <aside class="queue panel" aria-labelledby="queue-head">
      <header class="panel-head"><h2 id="queue-head"><svg><use href="#i-stack"/></svg> 图片队列</h2><span id="queue-count" class="pill"></span></header>
      <div class="queue-content">
        <div id="items" class="items"></div>
        <button id="drop" class="drop">
          <span class="drop-icon"><svg><use href="#i-plus"/></svg></span>
          <strong>拖拽图片到这里</strong>
          <small>或点击选择，可一次添加多张</small>
        </button>
        <button id="demo" class="text-btn demo-btn">试用示例图 <svg><use href="#i-arrow"/></svg></button>
      </div>
      <div class="queue-foot"><svg><use href="#i-folder"/></svg><span>支持浏览器可读的 JPG、PNG、WebP 等格式</span></div>
    </aside>

    <section class="preview panel" aria-label="图像预览">
      <header class="panel-head preview-head">
        <h2><svg><use href="#i-image"/></svg> 预览</h2>
        <div class="segmented" aria-label="预览模式">
          <button type="button" data-view="result" aria-pressed="true">成片</button>
          <button type="button" data-view="source" aria-pressed="false">原图</button>
          <button type="button" data-view="mask" aria-pressed="false">修抠图</button>
        </div>
      </header>
      <div id="mask-tools" class="mask-tools" hidden>
        <div class="segmented" aria-label="抠图工具">
          <button data-brush="sample" aria-pressed="false">取背景色</button>
          <button data-brush="keep" aria-pressed="true">保留</button>
          <button data-brush="erase" aria-pressed="false">擦除</button>
        </div>
        <label class="brush-size">笔刷 <input id="brush-size" aria-label="笔刷大小" type="range" min="3" max="60" value="18"></label>
        <button id="undo" class="text-btn" disabled>撤销</button>
        <button id="reset-mask" class="text-btn">还原</button>
      </div>
      <div id="stage" class="stage">
        <div id="empty" class="empty" hidden><svg><use href="#i-image"/></svg><h3 id="empty-title">添加图片开始</h3><p id="empty-body">支持拖入原始书照，或先试用示例图。</p></div>
        <div id="paper" class="paper" hidden><canvas id="preview" aria-label="当前书籍照片预览"></canvas></div>
      </div>
      <div id="notice" class="notice" role="status" hidden></div>
      <footer class="preview-foot"><span><i class="dot" id="preview-dot"></i><span id="preview-status" aria-live="polite">等待图片</span></span><span id="preview-size"></span></footer>
    </section>

    <aside class="settings panel" aria-labelledby="settings-head">
      <header class="panel-head"><h2 id="settings-head">样式设置</h2><button id="reset" class="text-btn" title="恢复默认样式"><svg><use href="#i-reset"/></svg> 重置</button></header>
      <div class="settings-content">
        <section class="setting-section">
          <h3><svg><use href="#i-color"/></svg> 背景</h3>
          <div class="swatches" aria-label="背景配色">
            <button title="雾灰" aria-label="雾灰" data-background="#e9e7e3" style="--chip:#e9e7e3"></button>
            <button title="暖白" aria-label="暖白" data-background="#f5f0e7" style="--chip:#f5f0e7"></button>
            <button title="浅粉" aria-label="浅粉" data-background="#e6c4c2" style="--chip:#e6c4c2"></button>
            <button title="淡苔绿" aria-label="淡苔绿" data-background="#cbd1c2" style="--chip:#cbd1c2"></button>
            <button title="炭黑" aria-label="炭黑" data-background="#292725" style="--chip:#292725"></button>
            <button title="透明" aria-label="透明" data-background="transparent" class="checker"></button>
            <label class="custom-chip" title="自定义背景色"><svg><use href="#i-plus"/></svg><input id="custom-bg" aria-label="自定义背景色" type="color" value="#e9e7e3"></label>
          </div>
          <div class="background-label"><span id="bg-name">雾灰</span><span id="bg-value">#E9E7E3</span></div>
        </section>
        <section class="setting-section">
          <h3><svg><use href="#i-sun"/></svg> 灯光与阴影</h3>
          <div class="light-grid" aria-label="灯光预设">
            <button data-light="soft" aria-pressed="true"><i class="light-icon soft"></i> 柔光</button>
            <button data-light="side" aria-pressed="false"><i class="light-icon side"></i> 侧光</button>
            <button data-light="flat" aria-pressed="false"><i class="light-icon flat"></i> 无阴影</button>
          </div>
          <label class="slider"><span>阴影浓度 <output data-out="shadow"></output></span><input type="range" min="0" max="90" data-setting="shadow"></label>

            <label class="slider"><span>多册间距 <output data-out="gap"></output></span><input type="range" min="2" max="22" data-setting="gap"></label>

<script>const Studio = (() => {
  function canvas(width, height) {
    const element = document.createElement('canvas');
    element.width = width;
    element.height = height;
    return element;
  }

  function decode(blob) {
    const url = URL.createObjectURL(blob);
    const image = new Image();
    image.src = url;
    return image.decode().then(() => image).finally(() => URL.revokeObjectURL(url));
  }

  function prepare(image) {
    const scale = Math.min(1, 880 / Math.max(image.naturalWidth, image.naturalHeight));
    const source = canvas(Math.round(image.naturalWidth * scale), Math.round(image.naturalHeight * scale));
    const context = source.getContext('2d', { willReadFrequently: true });
    context.imageSmoothingQuality = 'high';
    context.drawImage(image, 0, 0, source.width, source.height);
    const pixels = context.getImageData(0, 0, source.width, source.height).data;
    return { source, pixels, width: source.width, height: source.height, fullWidth: image.naturalWidth, fullHeight: image.naturalHeight };
  }

  function borderColor(pixels, width, height) {
    const samples = [[], [], []];
    const add = (x, y) => {
      const p = (y * width + x) * 4;
      if (pixels[p + 3] < 224) return;
      samples.forEach((channel, i) => channel.push(pixels[p + i]));
    };
    for (let x = 0; x < width; x += 2) {
      add(x, 0);
      add(x, height - 1);
    }
    for (let y = 1; y < height - 1; y += 2) {
      add(0, y);
      add(width - 1, y);
    }
    return samples.map(channel => channel.sort((a, b) => a - b)[channel.length >> 1] ?? 0);
  }

  function segment(prepared, tolerance, sample, edits) {
    const { pixels, width, height } = prepared;
    const count = width * height;
    const background = sample ?? borderColor(pixels, width, height);
    const squaredTolerance = 3 * tolerance * tolerance;
    const flood = new Uint8Array(count);
    const queue = new Int32Array(count);
    let head = 0;
    let end = 0;
    function visit(index) {
      if (flood[index]) return;
      const p = index * 4;
      const red = pixels[p] - background[0];
      const green = pixels[p + 1] - background[1];
      const blue = pixels[p + 2] - background[2];
      if (pixels[p + 3] > 12 && red * red + green * green + blue * blue > squaredTolerance) return;
      flood[index] = 1;
      queue[end++] = index;
    }
    for (let x = 0; x < width; x++) {
      visit(x);
      visit(count - width + x);
    }
    for (let y = 1; y < height - 1; y++) {
      visit(y * width);
      visit(y * width + width - 1);
    }
    while (head < end) {
      const index = queue[head++];
      const x = index % width;
      if (x > 0) visit(index - 1);
      if (x + 1 < width) visit(index + 1);
      if (index >= width) visit(index - width);
      if (index < count - width) visit(index + width);
    }

    const labels = new Int32Array(count);
    const regions = [];
    function addPixel(index, id) {
      if (labels[index] || pixels[index * 4 + 3] <= 12) return;
      if (edits?.[index] === -1 || (flood[index] && edits?.[index] !== 1)) return;
      labels[index] = id;
      queue[end++] = index;
    }
    for (let start = 0; start < count; start++) {
      head = 0;
      end = 0;
      const id = regions.length + 1;
      addPixel(start, id);
      if (!end) continue;
      let left = width, right = 0, top = height, bottom = 0, painted = false;
      while (head < end) {
        const index = queue[head++];
        const x = index % width;
        const y = Math.floor(index / width);
        left = Math.min(x, left);
        right = Math.max(x, right);
        top = Math.min(y, top);
        bottom = Math.max(y, bottom);
        painted ||= edits?.[index] === 1;
        if (x > 0) addPixel(index - 1, id);
        if (x + 1 < width) addPixel(index + 1, id);
        if (y > 0) addPixel(index - width, id);
        if (y + 1 < height) addPixel(index + width, id);
      }
      regions.push({ id, area: end, x: left, y: top, w: right - left + 1, h: bottom - top + 1, painted });
    }
    regions.sort((a, b) => b.area - a.area);
    const areaFloor = Math.max(count * 0.008, (regions[0]?.area ?? 0) * 0.06);
    const components = regions.filter(region => region.painted || (
      region.area >= areaFloor && region.w >= width * 0.055 && region.h >= height * 0.055 &&
      region.area >= region.w * region.h * 0.26
    ));
    const selected = new Uint8Array(regions.length + 1);
    for (const component of components) selected[component.id] = 1;
    for (let i = 0; i < count; i++) {
      if (!selected[labels[i]]) labels[i] = 0;
    }
    for (const component of components) {
      if (!component.painted) {
        if (component.x === 0) trimBorder(labels, component, width, true, true);
        if (component.x + component.w === width) trimBorder(labels, component, width, true, false);
        if (component.y === 0) trimBorder(labels, component, width, false, true);
        if (component.y + component.h === height) trimBorder(labels, component, width, false, false);
      }
    }
    // Close small breaks where dark print reaches the outer edge of a book.
    closeShortGaps(labels, pixels, edits, width, count, 1, width);
    closeShortGaps(labels, pixels, edits, width, count, width, height);

    for (const component of components) {
      updateBounds(labels, component, width);
      if (component.area >= areaFloor) recoverPrintedEdges(labels, pixels, edits, component, width);
    }
    components.sort((a, b) => b.area - a.area);
    const area = components.reduce((sum, item) => sum + item.area, 0);
    const touching = components.some(item => item.x === 0 || item.y === 0 || item.x + item.w === width || item.y + item.h === height);
    return { labels, components, uncertain: area > count * 0.985 || touching };
  }

  function trimBorder(labels, shape, stride, horizontal, low) {
    const lineStart = horizontal ? shape.y : shape.x;
    const lineLength = horizontal ? shape.h : shape.w;
    const acrossStart = horizontal ? shape.x : shape.y;
    const acrossLength = horizontal ? shape.w : shape.h;
    const step = low ? 1 : -1;
    const limit = low ? acrossStart : acrossStart + acrossLength - 1;
    const position = (line, across) => horizontal ? line * stride + across : across * stride + line;
    const points = [];
    const inset = Math.floor(lineLength * 0.04);
    for (let l = lineStart + inset; l < lineStart + lineLength - inset; l += Math.max(1, Math.ceil(lineLength / 64))) {
      for (let i = 0; i < acrossLength; i++) {
        const across = limit + step * i;
        if (labels[position(l, across)] === shape.id) {
          points.push([l, across]);
          break;
        }
      }
    }
    let edge = null;
    let best = 0;
    for (let a = 0; a < points.length; a++) {
      for (let b = a + 1; b < points.length; b++) {
        const [firstLine, firstAcross] = points[a];
        const [lastLine, lastAcross] = points[b];
        if (lastLine - firstLine < lineLength * 0.27) continue;
        const slope = (lastAcross - firstAcross) / (lastLine - firstLine);
        if (Math.abs(slope) > 0.5) continue;
        const offset = firstAcross - slope * firstLine;
        const support = points.reduce((count, [line, across]) => count + Number(Math.abs(line * slope + offset - across) <= 3.2), 0);
        if (support > best) {
          best = support;
          edge = { slope, offset };
        }
      }
    }
    if (!edge || best < points.length * 0.58) return;
    // The trimming line is only used for conspicuous outgrowths on a mostly straight book edge.
    const protruding = points.filter(([line, across]) => step * (line * edge.slope + edge.offset - across) > 8);
    if (protruding.length < points.length * 0.08) return;
    for (let line = lineStart; line < lineStart + lineLength; line++) {
      const boundary = line * edge.slope + edge.offset;
      for (let i = 0; i < acrossLength; i++) {
        const across = limit + step * i;
        if (step * (boundary - across) <= 2.5) break;
        const p = position(line, across);
        if (labels[p] === shape.id) labels[p] = 0;
      }
    }
  }

  function closeShortGaps(labels, pixels, edits, imageWidth, count, step, lineLength) {
    const lines = count / lineLength;
    const gapLimit = 5;
    for (let line = 0; line < lines; line++) {
      const start = step === 1 ? line * imageWidth : line;
      let previous = -1;
      for (let cell = 0; cell < lineLength; cell++) {
        const index = start + cell * step;
        const id = labels[index];
        if (!id) continue;
        if (previous >= 0 && cell - previous > 1 && cell - previous <= gapLimit && labels[start + previous * step] === id) {
          for (let k = previous + 1; k < cell; k++) {
            const hole = start + k * step;
            if (edits?.[hole] !== -1 && pixels[hole * 4 + 3] > 12) labels[hole] = id;
          }
        }
        previous = cell;
      }
    }
  }

  function updateBounds(labels, component, stride) {
    let left = stride, right = 0, top = component.y + component.h, bottom = 0, area = 0;
    const pad = 5;
    const y0 = Math.max(0, component.y - pad), y1 = Math.min(labels.length / stride, component.y + component.h + pad);
    const x0 = Math.max(0, component.x - pad), x1 = Math.min(stride, component.x + component.w + pad);
    for (let y = y0; y < y1; y++) {
      for (let x = x0; x < x1; x++) {
        if (labels[y * stride + x] !== component.id) continue;
        left = Math.min(x, left);
        right = Math.max(x, right);
        top = Math.min(y, top);
        bottom = Math.max(y, bottom);
        area++;
      }
    }
    Object.assign(component, { x: left, y: top, w: right - left + 1, h: bottom - top + 1, area });
  }

  function recoverPrintedEdges(labels, pixels, edits, component, stride) {
    const points = [];
    const { x, y, w, h, id } = component;
    for (let row = y; row < y + h; row++) {
      let first = x, last = x + w - 1;
      while (first <= last && labels[row * stride + first] !== id) first++;
      if (first > last) continue;
      while (last > first && labels[row * stride + last] !== id) last--;
      points.push([first, row], [last, row]);
    }
    points.sort((a, b) => a[0] - b[0] || a[1] - b[1]);
    const turn = (a, b, c) => (b[0] - a[0]) * (c[1] - a[1]) - (b[1] - a[1]) * (c[0] - a[0]);
    function halfHull(side) {
      const hull = [];
      for (const point of side) {
        while (hull.length >= 2 && turn(hull.at(-2), hull.at(-1), point) <= 0) hull.pop();
        hull.push(point);
      }
      return hull.slice(0, -1);
    }
    const hull = halfHull(points).concat(halfHull(points.reverse()));
    let area = 0;
    for (let i = 0; i < hull.length; i++) {
      const [ax, ay] = hull[i], [bx, by] = hull[(i + 1) % hull.length];
      area += ax * by - ay * bx;
    }
    if (hull.length < 3 || component.area < Math.abs(area) * 0.475) return;
    // Only near-convex subjects get their edge-connected typography protected.
    for (let row = y; row < y + h; row++) {
      let left = x + w, right = x - 1;
      for (let i = 0; i < hull.length; i++) {
        const [ax, ay] = hull[i], [bx, by] = hull[(i + 1) % hull.length];
        if (row < Math.min(ay, by) || row > Math.max(ay, by)) continue;
        const position = ay === by ? ax : ax + (row - ay) * (bx - ax) / (by - ay);
        left = Math.min(left, position);
        right = Math.max(right, position);
      }
      for (let col = Math.ceil(left); col <= Math.floor(right); col++) {
        const index = row * stride + col;
        if (labels[index] || edits?.[index] === -1 || pixels[index * 4 + 3] < 224) continue;
        labels[index] = id;
        component.area++;
      }
    }
  }

  function bounds(components) {
    const x = Math.min(...components.map(c => c.x));
    const y = Math.min(...components.map(c => c.y));
    return { x, y, w: Math.max(...components.map(c => c.x + c.w)) - x, h: Math.max(...components.map(c => c.y + c.h)) - y };
  }

  function makeCutout(image, prepared, mask, region, pieceId, scale, edge, exposure) {
    const { width, height } = prepared;
    const matte = canvas(region.w, region.h);
    const maskCtx = matte.getContext('2d');
    const data = maskCtx.createImageData(region.w, region.h);
    const belongs = index => pieceId ? mask.labels[index] === pieceId : mask.labels[index] > 0;
    for (let row = 0; row < region.h; row++) {
      const y = region.y + row;
      for (let col = 0; col < region.w; col++) {
        const x = region.x + col;
        const position = y * width + x;
        if (!belongs(position)) continue;
        const neighbors = Number(x > 0 && !belongs(position - 1)) + Number(x + 1 < width && !belongs(position + 1)) +
          Number(y > 0 && !belongs(position - width)) + Number(y + 1 < height && !belongs(position + width));
        data.data[(row * region.w + col) * 4 + 3] = 255 - Math.min(255, neighbors * edge * 0.8);
      }
    }
    maskCtx.putImageData(data, 0, 0);
    const result = canvas(Math.max(1, Math.ceil(region.w * scale)), Math.max(1, Math.ceil(region.h * scale)));
    const ctx = result.getContext('2d');
    ctx.imageSmoothingQuality = 'high';
    const sx = (image.naturalWidth || image.width) / width;
    const sy = (image.naturalHeight || image.height) / height;
    ctx.drawImage(image, region.x * sx, region.y * sy, region.w * sx, region.h * sy, 0, 0, result.width, result.height);
    if (exposure) {
      const tones = ctx.getImageData(0, 0, result.width, result.height);
      const gain = 1 + exposure / 100;
      for (let i = 0; i < tones.data.length; i += 4) {
        tones.data[i] *= gain;
        tones.data[i + 1] *= gain;
        tones.data[i + 2] *= gain;
      }
      ctx.putImageData(tones, 0, 0);
    }
    ctx.globalCompositeOperation = 'destination-in';
    ctx.drawImage(matte, 0, 0, result.width, result.height);
    return result;
  }

  function outputSize(ratio, size) {
    const ratios = { square: [1, 1], portrait: [4, 5], landscape: [4, 3], story: [9, 16] };
    const [x, y] = ratios[ratio] || ratios.square;
    return [Math.round(size * x / Math.max(x, y)), Math.round(size * y / Math.max(x, y))];
  }

  function render(target, image, prepared, mask, settings, angle, size) {
    const [width, height] = outputSize(settings.ratio, size);
    target.width = width;
    target.height = height;
    const ctx = target.getContext('2d');
    ctx.imageSmoothingQuality = 'high';
    if (settings.background !== 'transparent') {
      ctx.fillStyle = settings.background;
      ctx.fillRect(0, 0, width, height);
    }
    if (!mask.components.length) return false;

    const looseComponents = mask.components.filter(component => component.area >= mask.components[0].area * 0.16);
    const split = settings.layout !== 'original' && looseComponents.length > 1;
    const regions = split ? looseComponents.slice().sort((a, b) => (
      settings.layout === 'stack' ? (a.y + a.h / 2) - (b.y + b.h / 2) || a.x - b.x : (a.x + a.w / 2) - (b.x + b.w / 2)
    )) : [{ ...bounds(mask.components), id: 0 }];
    const vertical = settings.layout === 'stack';
    const gap = Math.min(prepared.width, prepared.height) * settings.gap / 100;
    const groupWidth = vertical ? Math.max(...regions.map(r => r.w)) : regions.reduce((sum, r) => sum + r.w, 0) + gap * (regions.length - 1);
    const groupHeight = vertical ? regions.reduce((sum, r) => sum + r.h, 0) + gap * (regions.length - 1) : Math.max(...regions.map(r => r.h));
    const radians = angle * Math.PI / 180;
    const rotatedWidth = groupWidth * Math.abs(Math.cos(radians)) + groupHeight * Math.abs(Math.sin(radians));
    const rotatedHeight = groupHeight * Math.abs(Math.cos(radians)) + groupWidth * Math.abs(Math.sin(radians));
    const fit = 1 - 2 * settings.margin / 100;
    const scale = Math.min(width * fit / rotatedWidth, height * fit / rotatedHeight);
    const artwork = canvas(width, height);
    const artworkCtx = artwork.getContext('2d');
    artworkCtx.imageSmoothingQuality = 'high';
    artworkCtx.translate(width / 2, height / 2);
    artworkCtx.rotate(radians);
    let offset = vertical ? -groupHeight / 2 : -groupWidth / 2;
    for (const region of regions) {
      const cut = makeCutout(image, prepared, mask, region, region.id, scale, settings.edge, settings.exposure);
      const x = vertical ? -region.w / 2 : offset;
      const y = vertical ? offset : -region.h / 2;
      artworkCtx.drawImage(cut, x * scale, y * scale, region.w * scale, region.h * scale);
      offset += (vertical ? region.h : region.w) + gap;
    }

    if (settings.shadow > 0) {
      const unit = Math.min(width, height) / 1000;
      const direction = { se: [1, 1], sw: [-1, 1], s: [0, 1], e: [1, 0], w: [-1, 0] }[settings.direction];
      const drawShadow = (opacity, distance, blur) => {
        ctx.shadowColor = 'rgba(22, 18, 15, ' + opacity + ')';
        ctx.shadowBlur = blur * unit;
        ctx.shadowOffsetX = width * 2 + direction[0] * distance * unit;
        ctx.shadowOffsetY = direction[1] * distance * unit;
        ctx.drawImage(artwork, -2 * width, 0);
      };
      ctx.save();
      const strength = settings.shadow / 100;
      drawShadow(strength * 0.56, 5 + settings.softness * 0.23, 5 + settings.softness * 0.52);
      drawShadow(strength * 0.48, 1.3, 2.5 + settings.softness * 0.035);
      ctx.restore();
    }
    ctx.drawImage(artwork, 0, 0);
    return true;
  }

  const crcTable = Uint32Array.from({ length: 256 }, (_, i) => {
    let value = i;
    for (let bit = 0; bit < 8; bit++) value = value & 1 ? 0xedb88320 ^ (value >>> 1) : value >>> 1;
    return value >>> 0;
  });
  function crc32(data) {
    let crc = 0xffffffff;
    for (const byte of data) crc = crcTable[(crc ^ byte) & 255] ^ (crc >>> 8);
    return (crc ^ 0xffffffff) >>> 0;
  }

  async function zip(files) {
    const bodies = [], directory = [];
    const encoder = new TextEncoder();
    const now = new Date();
    const date = ((now.getFullYear() - 1980) << 9) | ((now.getMonth() + 1) << 5) | now.getDate();
    const time = (now.getHours() << 11) | (now.getMinutes() << 5) | (now.getSeconds() >> 1);
    let offset = 0, indexSize = 0;
    for (const file of files) {
      const name = encoder.encode(file.name);
      const bytes = new Uint8Array(await file.blob.arrayBuffer());
      if (offset + bytes.length > 0xffffffff - indexSize - 65536) throw new Error('ZIP 超出 4 GB，请分批导出。');
      const crc = crc32(bytes);
      const header = new DataView(new ArrayBuffer(30));
      header.setUint32(0, 0x04034b50, true);
      header.setUint16(4, 20, true);
      header.setUint16(6, 0x800, true);
      header.setUint16(10, time, true);
      header.setUint16(12, date, true);
      header.setUint32(14, crc, true);
      header.setUint32(18, bytes.length, true);
      header.setUint32(22, bytes.length, true);
      header.setUint16(26, name.length, true);
      bodies.push(header.buffer, name, file.blob);
      const entry = new DataView(new ArrayBuffer(46));
      entry.setUint32(0, 0x02014b50, true);
      entry.setUint16(4, 20, true);
      entry.setUint16(6, 20, true);
      entry.setUint16(8, 0x800, true);
      entry.setUint16(12, time, true);
      entry.setUint16(14, date, true);
      entry.setUint32(16, crc, true);
      entry.setUint32(20, bytes.length, true);
      entry.setUint32(24, bytes.length, true);
      entry.setUint16(28, name.length, true);
      entry.setUint32(42, offset, true);
      directory.push(entry.buffer, name);
      offset += 30 + name.length + bytes.length;
      indexSize += 46 + name.length;
    }
    const footer = new DataView(new ArrayBuffer(22));

  async function loadDemo() {
    const existing = jobs.find(job => job.demo);
    if (existing) { choose(existing); setMode('result'); return; }
    $('#demo').disabled = true;
    try {
      const job = makeJob('After the rain.jpg', await demoImage(), true);
      await prepareJob(job);
      if (!jobs.length) {
        jobs.push(job);
        choose(job);
        setMode('result');
      } else {
        jobs.push(job);
        renderQueue();
        sync();
      }
    } catch {
      toast('示例图无法打开。可以添加自己的图片。');
    } finally {
      $('#demo').disabled = false;
    }
  }
  $('#demo').onclick = async () => {
    await loadDemo();
    const job = jobs.find(item => item.demo);
    if (job) { choose(job); setMode('result'); }
  };

  sync();
  loadDemo();
})();
</script>
</body>
</html>
